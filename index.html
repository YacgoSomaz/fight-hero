<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>战火英雄：单人网页复刻</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="intro">
        <p class="eyebrow">PRIVATE LOCAL EXPERIMENT · ORIGINAL SWF ASSET REFERENCE</p>
        <h1>战火英雄：单人网页复刻</h1>
        <p>先验证人物、枪械、鼠标瞄准、实体平台和稳定镜头；双人/联机暂不在本阶段范围内。</p>
      </section>
      <canvas id="game" width="1280" height="720" aria-label="单人游戏画面"></canvas>
      <section class="controls">
        <div><strong>P1</strong><span>A / D 移动 · W 跳跃 · 鼠标瞄准/左键射击 · F 射击</span></div>
        <button id="reset" type="button">重新开始</button>
      </section>
      <p class="notice">仅供本地学习与私人体验；请勿分发本原型或其中的原始游戏素材。</p>
    </main>
    <script type="module" src="src/main.mjs"></script>
  </body>
</html>
